<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="100%" height="100%" style="background:#080b11; font-family:'Segoe UI', Inter, system-ui, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e2de2"/>
      <stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
    <linearGradient id="grad-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2a9"/>
      <stop offset="100%" stop-color="#05c46b"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0c121f" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters for glowing effects -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00f2fe"/>
    </marker>
    <marker id="arrow-crimson" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff3366"/>
    </marker>
  </defs>

  <!-- Background Grid & Stars -->
  <g opacity="0.15">
    <path d="M 0 150 L 1200 150 M 0 300 L 1200 300 M 0 450 L 1200 450 M 0 600 L 1200 600 M 0 750 L 1200 750" stroke="#4facfe" stroke-width="0.8" stroke-dasharray="4,4"/>
    <path d="M 200 0 L 200 900 M 400 0 L 400 900 M 600 0 L 600 900 M 800 0 L 800 900 M 1000 0 L 1000 900" stroke="#4facfe" stroke-width="0.8" stroke-dasharray="4,4"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#grad-cyan)" filter="url(#glow-cyan)"/>
    <text x="24" y="32" font-size="24" text-anchor="middle" fill="#080b11" font-weight="bold">🛡️</text>
    <text x="65" y="28" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="-0.5">ArgusML: System Architecture &amp; 5-DSA Spine</text>
    <text x="65" y="46" fill="#8b9bb4" font-size="13">Universal Production AI Observability &amp; Graph-Powered Root Cause Diagnostic Engine</text>
  </g>

  <!-- Top Ingestion Source -->
  <g transform="translate(420, 115)">
    <rect x="0" y="0" width="360" height="50" rx="10" fill="#101726" stroke="#00f2fe" stroke-width="1.5" filter="url(#glow-cyan)"/>
    <text x="180" y="25" fill="#00f2fe" font-size="13" font-weight="bold" text-anchor="middle">LIVE PRODUCTION PREDICTION STREAM</text>
    <text x="180" y="41" fill="#8b9bb4" font-size="11" text-anchor="middle">Features (X), Model Prediction (ŷ), Ground Truth (y), Latency</text>
  </g>
  <path d="M 600 165 L 600 195" stroke="#00f2fe" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: EventQueue -->
  <g transform="translate(350, 195)">
    <rect x="0" y="0" width="500" height="85" rx="12" fill="url(#card-bg)" stroke="#00f2fe" stroke-width="1.2"/>
    <rect x="15" y="15" width="130" height="24" rx="6" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="0.8"/>
    <text x="80" y="31" fill="#00f2fe" font-size="10" font-weight="bold" text-anchor="middle">LAYER 1: INGESTION</text>
    <text x="160" y="32" fill="#ffffff" font-size="15" font-weight="bold">Circular FIFO EventQueue</text>
    <text x="440" y="32" fill="#00f2a9" font-size="12" font-weight="bold">O(1) Enqueue / Dequeue</text>
    <text x="20" y="62" fill="#8b9bb4" font-size="11.5">• High-throughput non-blocking buffer (Capacity: 5000) with mutex condition variables.</text>
    <text x="20" y="77" fill="#8b9bb4" font-size="11.5">• Drops oldest on overflow, decoupling client HTTP threads from analytical stream processors.</text>
  </g>
  <path d="M 600 280 L 600 310" stroke="#00f2fe" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: MetricSlidingWindow -->
  <g transform="translate(350, 310)">
    <rect x="0" y="0" width="500" height="85" rx="12" fill="url(#card-bg)" stroke="#00f2a9" stroke-width="1.2"/>
    <rect x="15" y="15" width="130" height="24" rx="6" fill="rgba(0, 242, 169, 0.15)" stroke="#00f2a9" stroke-width="0.8"/>
    <text x="80" y="31" fill="#00f2a9" font-size="10" font-weight="bold" text-anchor="middle">LAYER 2: TELEMETRY</text>
    <text x="160" y="32" fill="#ffffff" font-size="15" font-weight="bold">MetricSlidingWindow (Deque)</text>
    <text x="440" y="32" fill="#00f2a9" font-size="12" font-weight="bold">O(1) Amortized Update</text>
    <text x="20" y="62" fill="#8b9bb4" font-size="11.5">• Rolling window (W=400): Appends newest, evicts oldest with running confusion counters.</text>
    <text x="20" y="77" fill="#8b9bb4" font-size="11.5">• Rolling Accuracy, F1-Score, and P50/P95/P99 latency percentiles evaluated in constant time.</text>
  </g>
  <path d="M 600 395 L 600 425" stroke="#00f2fe" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Drift Engine & HashMap Registry -->
  <g transform="translate(350, 425)">
    <rect x="0" y="0" width="500" height="85" rx="12" fill="url(#card-bg)" stroke="#ffb703" stroke-width="1.2"/>
    <rect x="15" y="15" width="130" height="24" rx="6" fill="rgba(255, 183, 3, 0.15)" stroke="#ffb703" stroke-width="0.8"/>
    <text x="80" y="31" fill="#ffb703" font-size="10" font-weight="bold" text-anchor="middle">LAYER 3: DRIFT ENGINE</text>
    <text x="160" y="32" fill="#ffffff" font-size="15" font-weight="bold">ModelRegistry (HashMap)</text>
    <text x="440" y="32" fill="#ffb703" font-size="12" font-weight="bold">O(1) Baseline Lookup</text>
    <text x="20" y="62" fill="#8b9bb4" font-size="11.5">• 2-Sample Kolmogorov-Smirnov (KS) test: D = sup |F_base(x) - F_prod(x)| (p-value &lt; 0.05).</text>
    <text x="20" y="77" fill="#8b9bb4" font-size="11.5">• Population Stability Index (PSI &gt; 0.25 = Critical) across 10 empirical baseline quantile bins.</text>
  </g>
  <path d="M 600 510 L 600 540" stroke="#ff3366" stroke-width="2" marker-end="url(#arrow-crimson)"/>

  <!-- Layer 4: DependencyGraph (DAG) & RCA -->
  <g transform="translate(180, 540)">
    <rect x="0" y="0" width="840" height="155" rx="14" fill="url(#card-bg)" stroke="#8e2de2" stroke-width="1.5"/>
    <rect x="20" y="15" width="180" height="24" rx="6" fill="rgba(142, 45, 226, 0.2)" stroke="#8e2de2" stroke-width="0.8"/>
    <text x="110" y="31" fill="#8e2de2" font-size="10.5" font-weight="bold" text-anchor="middle">LAYER 4: ROOT CAUSE &amp; BLAST</text>
    <text x="215" y="32" fill="#ffffff" font-size="15" font-weight="bold">Dynamic DependencyGraph (DAG)</text>
    <text x="740" y="32" fill="#8e2de2" font-size="12" font-weight="bold">O(V + E) BFS Traversal</text>

    <!-- 4 Sub-blocks showing the 4 layers of DAG -->
    <g transform="translate(30, 55)">
      <!-- Pipelines -->
      <rect x="0" y="0" width="160" height="75" rx="8" fill="#0f1422" stroke="rgba(255,255,255,0.1)"/>
      <text x="80" y="24" fill="#4facfe" font-size="11" font-weight="bold" text-anchor="middle">1. Upstream Pipelines</text>
      <text x="80" y="44" fill="#8b9bb4" font-size="9.5" text-anchor="middle">Payment ETL / Mobile SDK</text>
      <text x="80" y="60" fill="#8b9bb4" font-size="9" text-anchor="middle">Kafka / Stream Sources</text>

      <!-- Arrow -->
      <path d="M 160 37 L 195 37" stroke="#4facfe" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Features -->
      <g transform="translate(200, 0)">
        <rect x="0" y="0" width="170" height="75" rx="8" fill="#0f1422" stroke="#ff3366" stroke-width="1.2" filter="url(#glow-crimson)"/>
        <text x="85" y="24" fill="#ff3366" font-size="11" font-weight="bold" text-anchor="middle">2. Model Features (1..K)</text>
        <text x="85" y="44" fill="#ff6b6b" font-size="9.5" font-weight="bold" text-anchor="middle">CULPRIT: Amount (KS: 0.48)</text>
        <text x="85" y="60" fill="#8b9bb4" font-size="9" text-anchor="middle">Reverse-BFS Attribution</text>
      </g>

      <!-- Arrow -->
      <path d="M 370 37 L 405 37" stroke="#00f2fe" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Model -->
      <g transform="translate(410, 0)">
        <rect x="0" y="0" width="160" height="75" rx="8" fill="#0f1422" stroke="#ffb703" stroke-width="1.2"/>
        <text x="80" y="24" fill="#ffb703" font-size="11" font-weight="bold" text-anchor="middle">3. Active Model</text>
        <text x="80" y="44" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">Fraud / Churn / House</text>
        <text x="80" y="60" fill="#8b9bb4" font-size="9" text-anchor="middle">Accuracy &lt; SLA (88%)</text>
      </g>

      <!-- Arrow -->
      <path d="M 570 37 L 605 37" stroke="#ffb703" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Services -->
      <g transform="translate(610, 0)">
        <rect x="0" y="0" width="170" height="75" rx="8" fill="#0f1422" stroke="rgba(255,255,255,0.1)"/>
        <text x="85" y="24" fill="#00f2a9" font-size="11" font-weight="bold" text-anchor="middle">4. Downstream Services</text>
        <text x="85" y="44" fill="#8b9bb4" font-size="9.5" text-anchor="middle">Checkout API / Wire Transfer</text>
        <text x="85" y="60" fill="#8b9bb4" font-size="9" text-anchor="middle">Forward-BFS Blast Radius</text>
      </g>
    </g>
  </g>
  <path d="M 600 695 L 600 725" stroke="#ff3366" stroke-width="2" marker-end="url(#arrow-crimson)"/>

  <!-- Layer 5: AlertMaxHeap -->
  <g transform="translate(350, 725)">
    <rect x="0" y="0" width="500" height="85" rx="12" fill="url(#card-bg)" stroke="#ff3366" stroke-width="1.5" filter="url(#glow-crimson)"/>
    <rect x="15" y="15" width="140" height="24" rx="6" fill="rgba(255, 51, 102, 0.2)" stroke="#ff3366" stroke-width="0.8"/>
    <text x="85" y="31" fill="#ff3366" font-size="10" font-weight="bold" text-anchor="middle">LAYER 5: ALERT TRIAGE</text>
    <text x="170" y="32" fill="#ffffff" font-size="15" font-weight="bold">AlertMaxHeap (Priority Queue)</text>
    <text x="440" y="32" fill="#ff3366" font-size="12" font-weight="bold">O(log N) Push / Pop</text>
    <text x="20" y="62" fill="#8b9bb4" font-size="11.5">• Dynamic composite scoring: Score = 0.50*(ΔAcc) + 0.30*(DriftScore) + 4.0*(BlastCount).</text>
    <text x="20" y="77" fill="#8b9bb4" font-size="11.5">• Sifts highest severity incidents to root; eliminates alert fatigue for on-call engineers.</text>
  </g>

  <!-- Left Side: Dashboard UI Annotation -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="260" height="220" rx="12" fill="#0f1422" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
    <text x="20" y="30" fill="#00f2fe" font-size="13" font-weight="bold">🖥️ Glassmorphic Dashboard</text>
    <text x="20" y="55" fill="#8b9bb4" font-size="11">• Real-time Canvas DAG Visualizer</text>
    <text x="20" y="75" fill="#8b9bb4" font-size="11">• Glowing node health telemetry</text>
    <text x="20" y="95" fill="#8b9bb4" font-size="11">• Live Feature Drift Table</text>
    <text x="20" y="115" fill="#8b9bb4" font-size="11">• 1-Click Dynamic Chaos Injector</text>
    <text x="20" y="135" fill="#8b9bb4" font-size="11">• Multi-Model Selector Dropdown</text>
    <text x="20" y="155" fill="#8b9bb4" font-size="11">• Root-Cause Diagnostic Modal</text>
    <text x="20" y="185" fill="#00f2a9" font-size="11.5" font-weight="bold">👉 http://127.0.0.1:8000</text>
  </g>

  <!-- Right Side: Universal Model Ingestion Annotation -->
  <g transform="translate(900, 260)">
    <rect x="0" y="0" width="260" height="220" rx="12" fill="#0f1422" stroke="rgba(142, 45, 226, 0.4)" stroke-width="1"/>
    <text x="20" y="30" fill="#8e2de2" font-size="13" font-weight="bold">🚀 Universal Model Engine</text>
    <text x="20" y="55" fill="#8b9bb4" font-size="11">• 100% Domain-Agnostic</text>
    <text x="20" y="75" fill="#8b9bb4" font-size="11">• Classification &amp; Regression</text>
    <text x="20" y="95" fill="#8b9bb4" font-size="11">• Upload ANY CSV dataset</text>
    <text x="20" y="115" fill="#8b9bb4" font-size="11">• Auto-baseline extraction</text>
    <text x="20" y="135" fill="#8b9bb4" font-size="11">• Dynamic 4-Layer DAG builder</text>
    <text x="20" y="155" fill="#8b9bb4" font-size="11">• Python Client SDK Integration</text>
    <text x="20" y="185" fill="#ffb703" font-size="11.5" font-weight="bold">📁 POST /api/models/upload-csv</text>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 840)">
    <text x="540" y="20" fill="#51627b" font-size="12" text-anchor="middle">ArgusML Architecture Specification • 100% Native Pure Python &amp; Web Standards • Zero External Heavy Frameworks</text>
  </g>
</svg>
